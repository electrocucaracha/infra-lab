apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: import-smoke
  annotations:
    cdi.kubevirt.io/storage.bind.immediate.requested: "true"
spec:
  source:
    blank: {}
  storage:
    accessModes: [ReadWriteOnce]
    storageClassName: topolvm-provisioner
    resources:
      requests:
        storage: 128Mi
