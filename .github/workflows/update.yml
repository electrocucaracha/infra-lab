name: Update Component Versions
on:
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-version-updates
  cancel-in-progress: false
jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    uses: electrocucaracha/gh-workflows/.github/workflows/update.yml@5459142baf98c47e96f454bb56e3e549c334a606 # v13.1.1
    secrets:
      WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
