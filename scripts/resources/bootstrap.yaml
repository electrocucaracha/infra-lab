apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ci-infrastructure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/electrocucaracha/infra-lab.git
    targetRevision: HEAD
    path: scripts/resources/in-cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
