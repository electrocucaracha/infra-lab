apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubevirt
  namespace: argocd
spec:
  project: default
  source:
    chart: kubevirt
    repoURL: https://encircle360-oss.github.io/helm-charts/
    targetRevision: 0.1.2
    helm:
      valuesObject:
        namespace:
          name: kubevirt-system
        kubevirt:
          configuration:
            developerConfiguration:
              featureGates:
                - EnableVirtioFsConfigVolumes
                - EnableVirtioFsStorageVolumes
            network:
              permitBridgeInterfaceOnPodNetwork: true
  destination:
    name: infra-lab
    namespace: kubevirt-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
