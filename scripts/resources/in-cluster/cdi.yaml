apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cdi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/electrocucaracha/infra-lab.git
    targetRevision: HEAD
    path: scripts/resources/ci/cdi
  destination:
    name: infra-lab
    namespace: cdi
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
