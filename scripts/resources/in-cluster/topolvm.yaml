apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: topolvm
  namespace: argocd
spec:
  project: default
  source:
    chart: topolvm
    repoURL: https://topolvm.github.io/topolvm
    targetRevision: 15.9.0
    helm:
      valuesObject:
        cert-manager:
          enabled: false
        controller:
          affinity: |
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: app.kubernetes.io/component
                          operator: In
                          values:
                            - controller
                        - key: app.kubernetes.io/name
                          operator: In
                          values:
                            - topolvm
                    topologyKey: kubernetes.io/hostname
        storageClasses:
          - name: topolvm-provisioner
            storageClass:
              fsType: ext4
              reclaimPolicy: Delete
              annotations: {}
              isDefaultClass: true
              volumeBindingMode: WaitForFirstConsumer
              allowVolumeExpansion: true
              additionalParameters: {}
              mountOptions: []
        lvmd:
          deviceClasses:
            - name: ssd
              volume-group: csi-vgs
              default: true
              spare-gb: 1
  destination:
    name: infra-lab
    namespace: topolvm-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
