apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubean
  namespace: argocd
spec:
  project: default
  source:
    chart: kubean
    repoURL: https://kubean-io.github.io/kubean-helm-chart/
    targetRevision: v0.32.1
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kubean-system
  syncPolicy:
    automated:
      enabled: true
    syncOptions:
      - CreateNamespace=true
