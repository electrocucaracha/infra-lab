apiVersion: v1
kind: ConfigMap
metadata:
  name: vars-conf
  namespace: kubean-system
data:
  group_vars.yml: |
    container_manager: containerd
    kube_network_plugin: flannel
    flannel_backend_type: host-gw
    kube_proxy_mode: ipvs
    etcd_deployment_type: host
    kubelet_deployment_type: host
    local_volume_provisioner_enabled: false
    enable_nodelocaldns: true
    ndots: 1
    resolvconf_mode: none
    kube_proxy_scheduler: sh
    cert_manager_enabled: true
---
apiVersion: kubean.io/v1alpha1
kind: Cluster
metadata:
  name: infra-lab
  labels:
    clusterName: infra-ci
spec:
  hostsConfRef:
    namespace: kubean-system
    name: hosts-conf
  varsConfRef:
    namespace: kubean-system
    name: vars-conf
---
apiVersion: kubean.io/v1alpha1
kind: ClusterOperation
metadata:
  name: install-ops
spec:
  cluster: infra-lab
  image: ghcr.m.daocloud.io/kubean-io/spray-job:v0.32.1
  actionType: playbook
  action: cluster.yml
  preHook:
    - actionType: playbook
      action: disable-firewalld.yml
  postHook:
    - actionType: playbook
      action: kubeconfig.yml
    - actionType: playbook
      action: cluster-info.yml
