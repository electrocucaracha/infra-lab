apiVersion: v1
kind: ConfigMap
metadata:
  name: hosts-conf
  namespace: kubean-system
data:
  hosts.yml: |
    all:
      hosts:
        aio:
          ip: 10.10.16.3
          access_ip: 10.10.16.3
          ansible_host: 10.10.16.3
          ansible_connection: ssh
          ansible_user: vagrant
          ansible_password: vagrant
      children:
        kube_control_plane:
          hosts:
            aio:
        kube_node:
          hosts:
            aio:
        etcd:
          hosts:
            aio:
        k8s_cluster:
          children:
            kube_control_plane:
            kube_node:
        calico_rr:
          hosts: {}
